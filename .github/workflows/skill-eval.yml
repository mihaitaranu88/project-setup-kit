name: Skill evaluation

on:
  workflow_dispatch:
    inputs:
      case:
        description: "Case name glob, e.g. detect-* (empty = all)"
        required: false
        default: ""
      runs:
        description: "Runs per case"
        required: false
        default: "3"
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: skill-eval
  cancel-in-progress: false

jobs:
  eval:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          package-manager-cache: false
      - name: Check that a Claude credential is configured
        id: credential
        env:
          HAS_KEY: ${{ secrets.ANTHROPIC_API_KEY != '' || secrets.CLAUDE_CODE_OAUTH_TOKEN != '' }}
        run: |
          if [ "$HAS_KEY" = "true" ]; then echo "available=true" >> "$GITHUB_OUTPUT"; else
            echo "::notice::Skipped: add an ANTHROPIC_API_KEY or CLAUDE_CODE_OAUTH_TOKEN repository secret to run the skill evaluation."
            echo "available=false" >> "$GITHUB_OUTPUT"; fi
      - name: Install Claude Code
        if: steps.credential.outputs.available == 'true'
        run: npm install -g @anthropic-ai/claude-code@2.1.322
      - name: Run the plugin eval suite (with and without the plugin)
        if: steps.credential.outputs.available == 'true'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          CASE: ${{ inputs.case }}
          RUNS: ${{ inputs.runs || '3' }}
        run: |
          args=(--runs "$RUNS" --json eval-result.json --report eval-report.html)
          if [ -n "$CASE" ]; then args+=(--case "$CASE"); fi
          npm run eval -- "${args[@]}"
      - name: Summarize
        if: always() && steps.credential.outputs.available == 'true'
        run: |
          if [ -f eval-result.json ]; then node tests/summarize-eval.mjs eval-result.json >> "$GITHUB_STEP_SUMMARY"; fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always() && steps.credential.outputs.available == 'true'
        with:
          name: eval-report
          path: |
            eval-result.json
            eval-report.html
          if-no-files-found: ignore
