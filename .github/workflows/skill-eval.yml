name: Skill evaluation

on:
  workflow_dispatch:
    inputs:
      only:
        description: "Comma-separated fixtures to run (empty = all)"
        required: false
        default: ""
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: skill-eval
  cancel-in-progress: false

jobs:
  eval:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check that a Claude credential is configured
        id: credential
        env:
          HAS_KEY: ${{ secrets.ANTHROPIC_API_KEY != '' || secrets.CLAUDE_CODE_OAUTH_TOKEN != '' }}
        run: |
          if [ "$HAS_KEY" = "true" ]; then echo "available=true" >> "$GITHUB_OUTPUT"; else
            echo "::notice::Skipped: add an ANTHROPIC_API_KEY or CLAUDE_CODE_OAUTH_TOKEN repository secret to run the skill evaluation."
            echo "available=false" >> "$GITHUB_OUTPUT"; fi
      - name: Install Claude Code
        if: steps.credential.outputs.available == 'true'
        run: npm install -g @anthropic-ai/claude-code
      - name: Run the skill's analysis on every fixture and compare with expected.json
        if: steps.credential.outputs.available == 'true'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          ONLY: ${{ inputs.only }}
        run: |
          if [ -n "$ONLY" ]; then node tests/eval-skill.mjs --only "$ONLY"; else node tests/eval-skill.mjs; fi
