go:
  name: "{{PART_NAME}} (go)"
  runs-on: ubuntu-latest
  defaults:
    run:
      working-directory: "{{PART_PATH}}"
  steps:
    - uses: actions/checkout@v7
      with:
        persist-credentials: false
    - uses: actions/setup-go@v7
      with:
        go-version-file: "{{PART_PATH}}/go.mod"
    - uses: golangci/golangci-lint-action@v9
      with:
        working-directory: "{{PART_PATH}}"
    - run: go vet ./...
    - run: go test -race ./...
    - run: go build ./...
    - run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...
    - name: Dead code (warning)
      if: "{{ITEM_24}}"
      continue-on-error: true
      run: go run golang.org/x/tools/cmd/deadcode@v0.52.0 ./...
