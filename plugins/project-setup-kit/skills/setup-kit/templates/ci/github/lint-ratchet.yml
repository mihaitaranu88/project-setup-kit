name: Lint ratchet

on:
  pull_request:

concurrency:
  group: lint-ratchet-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ratchet:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        if: "{{USES_PNPM}}"
      - uses: actions/setup-node@v4
        with:
          node-version: "{{NODE_VERSION}}"
          cache: "{{PACKAGE_MANAGER}}"
      - run: "{{INSTALL_COMMAND}}"
      - name: Strict rules on changed lines
        env:
          BASE_REF: ${{ github.base_ref }}
        run: node .ai-kit/scripts/lint-ratchet.mjs --base "origin/$BASE_REF"
      - name: Warning budget may only go down
        env:
          BASE_REF: ${{ github.base_ref }}
        run: node .ai-kit/scripts/warning-budget.mjs --against-base --base "origin/$BASE_REF"
