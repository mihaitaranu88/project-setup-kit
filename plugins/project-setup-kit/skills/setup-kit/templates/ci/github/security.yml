name: Security

on:
  pull_request:
  push:
    branches: ["{{BASE_BRANCH}}"]

permissions:
  contents: read

jobs:
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: gitleaks
        env:
          LOG_OPTS: ${{ github.event_name == 'pull_request' && format('origin/{0}..HEAD', github.base_ref) || '-1' }}
        run: |
          docker run --rm -v "$PWD:/repo" -w /repo ghcr.io/gitleaks/gitleaks:{{GITLEAKS_VERSION}} \
            git /repo --redact --no-banner --log-opts="$LOG_OPTS"

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6
        if: "{{USES_PNPM}}"
      - uses: actions/setup-node@v7
        if: "{{IS_NODE}}"
        with:
          node-version: "{{NODE_VERSION}}"
      - uses: astral-sh/setup-uv@v10.3.3
        if: "{{IS_UV}}"
      - name: Known vulnerabilities (high and critical)
        run: "{{AUDIT_COMMAND}}"

  new-dependencies:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: "{{NODE_VERSION}}"
      - name: New dependencies exist and are not brand new
        env:
          BASE_REF: ${{ github.base_ref }}
        run: node .ai-kit/scripts/new-deps.mjs --base "origin/$BASE_REF"

  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/dependency-review-action@v5.0.0
        with:
          fail-on-severity: high
          comment-summary-in-pr: on-failure
          allow-licenses: "{{ALLOWED_LICENSES}}"
