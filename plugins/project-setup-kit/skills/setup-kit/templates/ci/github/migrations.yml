name: Migrations

on:
  pull_request:
    paths:
      - "{{MIGRATIONS_GLOB}}"

permissions:
  contents: read

jobs:
  migrations:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: "{{NODE_VERSION}}"
      - name: New migrations are reversible and ordered
        env:
          BASE_REF: ${{ github.base_ref }}
        run: node .ai-kit/scripts/migration-check.mjs --base "origin/$BASE_REF"
