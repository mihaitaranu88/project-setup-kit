java:
  name: "{{PART_NAME}} (java)"
  runs-on: ubuntu-latest
  defaults:
    run:
      working-directory: "{{PART_PATH}}"
  steps:
    - uses: actions/checkout@v7
      with:
        persist-credentials: false
        fetch-depth: 0
    - uses: actions/setup-java@v6
      with:
        distribution: temurin
        java-version: "{{JAVA_VERSION}}"
        cache: "{{BUILD_TOOL}}"
    - name: Build, test and static checks (Maven)
      if: "{{IS_MAVEN}}"
      run: ./mvnw --batch-mode --no-transfer-progress verify
    - name: Build, test and static checks (Gradle)
      if: "{{IS_GRADLE}}"
      run: ./gradlew --no-daemon check build
    - name: Submit the Gradle dependency graph for dependency review
      if: "{{IS_GRADLE}}"
      uses: gradle/actions/dependency-submission@v6
      with:
        build-root-directory: "{{PART_PATH}}"
    - name: Precheck on the PR diff
      if: github.event_name == 'pull_request'
      env:
        BASE_REF: ${{ github.base_ref }}
      run: node "$GITHUB_WORKSPACE/.ai-kit/scripts/precheck.mjs" --base "origin/$BASE_REF"
