name: Coverage on new code

on:
  pull_request:

permissions:
  contents: read

jobs:
  diff-coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Tests with coverage (lcov or cobertura XML)
        run: "{{TEST_WITH_COVERAGE_COMMAND}}"
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install diff-cover
      - name: Coverage of changed lines
        env:
          BASE_REF: ${{ github.base_ref }}
        run: diff-cover "{{COVERAGE_REPORT_PATH}}" --compare-branch="origin/$BASE_REF" --fail-under={{COVERAGE_THRESHOLD}}
