rust:
  name: "{{PART_NAME}} (rust)"
  runs-on: ubuntu-latest
  defaults:
    run:
      working-directory: "{{PART_PATH}}"
  steps:
    - uses: actions/checkout@v7
      with:
        persist-credentials: false
        fetch-depth: 0
    - run: rustup toolchain install stable --profile minimal --component clippy,rustfmt
    - uses: Swatinem/rust-cache@v2
      with:
        workspaces: "{{PART_PATH}}"
    - run: cargo fmt --all --check
    - run: cargo clippy --all-targets --locked -- -D warnings
    - run: cargo test --locked
    - run: cargo build --locked
    - name: Precheck on the PR diff
      if: github.event_name == 'pull_request'
      env:
        BASE_REF: ${{ github.base_ref }}
      run: node "$GITHUB_WORKSPACE/.ai-kit/scripts/precheck.mjs" --base "origin/$BASE_REF"
