ruby:
  name: "{{PART_NAME}} (ruby)"
  runs-on: ubuntu-latest
  defaults:
    run:
      working-directory: "{{PART_PATH}}"
  steps:
    - uses: actions/checkout@v7
      with:
        persist-credentials: false
    - uses: ruby/setup-ruby@v1
      with:
        working-directory: "{{PART_PATH}}"
        bundler-cache: true
    - run: bundle exec rubocop
    - run: "{{TEST_COMMAND}}"
    - run: bundle exec bundler-audit check --update
