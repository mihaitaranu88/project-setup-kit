python:
  name: "{{PART_NAME}} (python)"
  runs-on: ubuntu-latest
  defaults:
    run:
      working-directory: "{{PART_PATH}}"
  steps:
    - uses: actions/checkout@v7
      with:
        persist-credentials: false
        fetch-depth: 0
    - uses: astral-sh/setup-uv@v10.3.3
    - run: uv sync --frozen
    - run: uv run ruff check .
    - run: uv run ruff format --check .
    - run: "uv run {{TYPECHECK_COMMAND}}"
    - run: uv run pytest
    - name: Dead code (warning)
      if: "{{ITEM_24}}"
      continue-on-error: true
      run: uvx vulture==2.16 . --min-confidence 80
    - name: Precheck on the PR diff
      if: github.event_name == 'pull_request'
      env:
        BASE_REF: ${{ github.base_ref }}
      run: node "$GITHUB_WORKSPACE/.ai-kit/scripts/precheck.mjs" --base "origin/$BASE_REF"
