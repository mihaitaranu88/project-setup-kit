name: Workflow security

on:
  pull_request:
    paths: [".github/workflows/**", ".github/actions/**", ".github/dependabot.yml"]
  push:
    branches: ["{{BASE_BRANCH}}"]
    paths: [".github/workflows/**", ".github/actions/**"]

permissions:
  contents: read

jobs:
  workflows:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: actionlint (syntax, expressions, shell scripts)
        run: docker run --rm -v "$PWD:/repo" -w /repo rhysd/actionlint:1.7.12 -color
      - name: zizmor (script injection, unpinned actions, broad permissions, credential leaks)
        run: docker run --rm -v "$PWD:/repo" -w /repo ghcr.io/zizmorcore/zizmor:1.32.0 --format=github --offline --min-severity=medium .github/workflows
