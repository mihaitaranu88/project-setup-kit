name: Duplicate code

on:
  pull_request:

permissions:
  contents: read

jobs:
  jscpd:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: "{{NODE_VERSION}}"
      - name: Duplicates in changed files (warning)
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          files=$(git diff --name-only --diff-filter=ACMR "origin/$BASE_REF...HEAD" | grep -E '{{SOURCE_FILES_REGEX}}' || true)
          if [ -z "$files" ]; then echo "No source files changed."; exit 0; fi
          npx --yes jscpd@4 --min-lines 8 --reporters console --ignore "{{GENERATED_GLOBS}}" {{SOURCE_DIRS}} | tee jscpd.txt
          for file in $files; do grep -F "$file" jscpd.txt && echo "::warning file=$file::Duplicated block found, consider reusing existing code." || true; done
