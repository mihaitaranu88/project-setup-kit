name: Frontend preview

on:
  pull_request:
    types: [opened, synchronize, reopened, closed]

concurrency:
  group: preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  scope:
    if: github.event.action != 'closed'
    runs-on: ubuntu-latest
    outputs:
      frontend-only: ${{ steps.check.outputs.frontend-only }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: check
        env:
          BASE_REF: ${{ github.base_ref }}
          FRONTEND_PATH: "{{FRONTEND_PATH}}"
        run: |
          changed=$(git diff --name-only "origin/$BASE_REF...HEAD")
          if [ -n "$changed" ] && ! echo "$changed" | grep -qv "^$FRONTEND_PATH/"; then
            echo "frontend-only=true" >> "$GITHUB_OUTPUT"
          else
            echo "frontend-only=false" >> "$GITHUB_OUTPUT"
          fi

  deploy:
    needs: scope
    if: needs.scope.outputs.frontend-only == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        if: "{{USES_PNPM}}"
      - uses: actions/setup-node@v4
        with:
          node-version: "{{NODE_VERSION}}"
          cache: "{{PACKAGE_MANAGER}}"
      - working-directory: "{{FRONTEND_PATH}}"
        env:
          "{{API_URL_VARIABLE}}": "{{SHARED_DEV_API_URL}}"
        run: |
          {{INSTALL_COMMAND}}
          {{BUILD_COMMAND}}
      - id: publish
        working-directory: "{{FRONTEND_PATH}}"
        env:
          PREVIEW_NAME: pr-${{ github.event.pull_request.number }}
          "{{HOSTING_TOKEN_VARIABLE}}": ${{ secrets.PREVIEW_DEPLOY_TOKEN }}
        run: "{{DEPLOY_COMMAND_PRINTING_URL_TO_OUTPUT}}"
      - uses: actions/github-script@v7
        env:
          PREVIEW_URL: ${{ steps.publish.outputs.url }}
        with:
          script: |
            const marker = '<!-- frontend-preview -->';
            const body = `${marker}\nPreview: ${process.env.PREVIEW_URL}`;
            const issue = { owner: context.repo.owner, repo: context.repo.repo, issue_number: context.payload.pull_request.number };
            const comments = await github.paginate(github.rest.issues.listComments, issue);
            const existing = comments.find(comment => comment.body?.startsWith(marker));
            if (existing) await github.rest.issues.updateComment({ ...issue, comment_id: existing.id, body });
            else await github.rest.issues.createComment({ ...issue, body });

  cleanup:
    if: github.event.action == 'closed'
    runs-on: ubuntu-latest
    steps:
      - env:
          PREVIEW_NAME: pr-${{ github.event.pull_request.number }}
          "{{HOSTING_TOKEN_VARIABLE}}": ${{ secrets.PREVIEW_DEPLOY_TOKEN }}
        run: "{{DELETE_PREVIEW_COMMAND}}"
