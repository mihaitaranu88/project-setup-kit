node:
  name: "{{PART_NAME}} (node)"
  runs-on: ubuntu-latest
  defaults:
    run:
      working-directory: "{{PART_PATH}}"
  steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
    - uses: pnpm/action-setup@v4
      if: "{{USES_PNPM}}"
    - uses: actions/setup-node@v4
      with:
        node-version: "{{NODE_VERSION}}"
        cache: "{{PACKAGE_MANAGER}}"
        cache-dependency-path: "{{PART_PATH}}/{{LOCKFILE}}"
    - run: "{{INSTALL_COMMAND}}"
    - run: "{{LINT_COMMAND}}"
    - run: "{{TYPECHECK_COMMAND}}"
    - run: "{{TEST_COMMAND}}"
    - run: "{{BUILD_COMMAND}}"
      env:
        "{{BUILD_ENV_PLACEHOLDERS}}": "{{FAKE_VALUE}}"
    - name: Precheck on the PR diff
      if: github.event_name == 'pull_request'
      run: node .ai-kit/scripts/precheck.mjs --base "origin/${{ github.base_ref }}"
    - name: Dead code (warning)
      if: "{{ITEM_24}}"
      continue-on-error: true
      run: npx --yes knip@5 --no-exit-code
